"start">R4 = 24.9 kΩ</text><polygon points="1070,222 1070,328 1165,275.0" class="op"/><text x="1081" y="257" class="st" text-anchor="start">−</text><text x="1081" y="298" class="st" text-anchor="start">+</text><text x="1112" y="277" class="small" text-anchor="middle">U1B</text><line class="wire" x1="1165" y1="275" x2="1223" y2="275"/><circle cx="1223" cy="275" r="4.5" class="node"/><line class="wire" x1="1223" y1="275" x2="1270" y2="275"/><text x="1270" y="259" class="accent" text-anchor="start">Vo</text><line class="wire" x1="1270" y1="275" x2="1305" y2="275"/><text x="1278" y="300" class="dim" text-anchor="start">al filtro y ADC</text><text x="915" y="377" class="accent" text-anchor="start">Vo = (R2/R1) × (Vs − Vref) = 2.49(Vs − 0.5)</text><rect x="32" y="466" width="1308" height="207" rx="13" fill="#f5f9fa" stroke="#d8e4e7"/><text x="52" y="501" class="st" text-anchor="start">4 · Digitalización, supervisión y salidas de estado</text><rect x="95" y="536" width="229" height="88" rx="7" class="chip"/><text x="209" y="560" class="st" text-anchor="middle">ESP32 clásico</text><text x="209" y="584" class="small" text-anchor="middle">ADC1 / GPIO36</text><text x="209" y="606" class="small" text-anchor="middle">115200 bps · USB</text><line class="wire" x1="1270" y1="275" x2="1270" y2="447"/><line class="wire" x1="1270" y1="447" x2="209" y2="447"/><line class="wire" x1="209" y1="447" x2="209" y2="536"/><text x="410" y="438" class="accent" text-anchor="start">Vo: 0.498–2.988 V (20–120 °C)</text><rect x="428" y="536" width="269" height="88" rx="7" class="chip"/><text x="562" y="560" class="st" text-anchor="middle">Interfaz Python</text><text x="562" y="585" class="small" text-anchor="middle">Conectar · Adquirir · Procesar</text><text x="562" y="605" class="small" text-anchor="middle">Guardar · Salir</text><line class="wire" x1="324" y1="578" x2="428" y2="578"/><text x="376" y="562" class="small" text-anchor="middle">USB ↔</text><rect x="782" y="531" width="232" height="96" rx="7" class="chip"/><text x="898" y="557" class="st" text-anchor="middle">GPIO22</text><text x="898" y="580" class="small" text-anchor="middle">330 Ω + LED rojo</text><text x="898" y="602" class="small" text-anchor="middle">Enfriamiento</text><rect x="1059" y="531" width="236" height="96" rx="7" class="chip"/><text x="1177" y="557" class="st" text-anchor="middle">GPIO23</text><text x="1177" y="580" class="small" text-anchor="middle">330 Ω + LED verde</text><text x="1177" y="602" class="small" text-anchor="middle">Calefacción</text><line class="wire" x1="324" y1="615" x2="344" y2="615"/><line class="wire" x1="344" y1="615" x2="344" y2="641"/><line class="wire" x1="344" y1="641" x2="760" y2="641"/><line class="wire" x1="760" y1="641" x2="760" y2="615"/><line class="wire" x1="760" y1="615" x2="782" y2="615"/><line class="wire" x1="760" y1="641" x2="1035" y2="641"/><line class="wire" x1="1035" y1="641" x2="1035" y2="615"/><line class="wire" x1="1035" y1="615" x2="1059" y2="615"/><text x="758" y="688" class="dim" text-anchor="start">Exclusivamente LEDs de baja tensión; las cargas HVAC reales necesitan protección e interfaces independientes.</text></svg>