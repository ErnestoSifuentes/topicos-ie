<text x="41" y="76" class="dim">Esquema funcional de diseño con valores nominales; verificar distribución de pines en hoja de datos antes del montaje</text><rect x="31" y="109" width="300" height="288" rx="12" fill="#fbfdfd" stroke="#e0e8ea"/><text x="51" y="141" class="st" text-anchor="start">1 · Sensor</text><rect x="365" y="109" width="335" height="288" rx="12" fill="#fbfdfd" stroke="#e0e8ea"/><text x="385" y="141" class="st" text-anchor="start">2 · Referencia de 500 mV</text><rect x="725" y="109" width="615" height="288" rx="12" fill="#fbfdfd" stroke="#e0e8ea"/><text x="745" y="141" class="st" text-anchor="start">3 · Restar y amplificar</text><rect x="98" y="192" width="137" height="104" rx="6" class="chip"/><text x="167" y="222" class="head" text-anchor="middle">TMP36</text><text x="167" y="246" class="small" text-anchor="middle">Vs = 0.5 + 0.01T</text><text x="167" y="268" class="dim" text-anchor="middle">2.7–5.5 V</text><line class="wire" x1="166" y1="162" x2="166" y2="192"/><text x="166" y="153" class="accent" text-anchor="middle">+3.3 V</text><line class="wire" x1="166" y1="296" x2="166" y2="333"/><line class="wire" x1="166" y1="333" x2="166" y2="345"/><line class="wire" x1="154" y1="345" x2="178" y2="345"/><line class="wire" x1="158" y1="349" x2="174" y2="349"/><line class="wire" x1="162" y1="353" x2="170" y2="353"/><line class="wire" x1="235" y1="245" x2="312" y2="245"/><circle cx="312" cy="245" r="4.5" class="node"/><text x="265" y="233" class="accent" text-anchor="start">Vs</text><text x="70" y="376" class="small" text-anchor="start">100 nF entre alimentación y GND</text><line class="wire" x1="438" y1="164" x2="438" y2="182"/><text x="438" y="153" class="accent" text-anchor="middle">+3.3 V</text><line class="wire" x1="438" y1="168" x2="438" y2="182"/><rect x="426" y="182" width="24" height="48" rx="1" class="res"/><line class="wire" x1="438" y1="230" x2="438" y2="244"/><text x="457" y="216" class="small" text-anchor="start">56 kΩ</text><line class="wire" x1="438" y1="244" x2="438" y2="275"/><circle cx="438" cy="275" r="4.5" class="node"/><text x="455" y="269" class="accent" text-anchor="start">Vref ≈ 0.5 V</text><line class="wire" x1="438" y1="281" x2="438" y2="295"/><rect x="426" y="295" width="24" height="48" rx="1" class="res"/><line class="wire" x1="438" y1="343" x2="438" y2="357"/><line class="wire" x1="438" y1="275" x2="438" y2="281"/><line class="wire" x1="438" y1="281" x2="438" y2="281"/><line class="wire" x1="438" y1="275" x2="438" y2="281"/><line class="wire" x1="438" y1="281" x2="438" y2="281"/><line class="wire" x1="438" y1="281" x2="438" y2="295"/><text x="457" y="327" class="small" text-anchor="start">10 kΩ</text><line class="wire" x1="438" y1="357" x2="438" y2="362"/><line class="wire" x1="438" y1="362" x2="438" y2="374"/><line class="wire" x1="426" y1="374" x2="450" y2="374"/><line class="wire" x1="430" y1="378" x2="446" y2="378"/><line class="wire" x1="434" y1="382" x2="442" y2="382"/><line class="wire" x1="438" y1="275" x2="535" y2="275"/><polygon points="545,222 545,328 633,275.0" class="op"/><text x="556" y="257" class="st" text-anchor="start">−</text><text x="556" y="298" class="st" text-anchor="start">+</text><line class="wire" x1="535" y1="275" x2="535" y2="296"/><line class="wire" x1="535" y1="296" x2="545" y2="296"/><line class="wire" x1="545" y1="258" x2="539" y2="258"/><line class="wire" x1="539" y1="258" x2="539" y2="211"/><line class="wire" x1="539" y1="211" x2="666" y2="211"/><line class="wire" x1="666" y1="211" x2="666" y2="275"/><line class="wire" x1="633" y1="275" x2="666" y2="275"/><text x="588" y="279" class="small" text-anchor="middle">U1A</text><text x="588" y="292" class="dim" text-anchor="middle">buffer</text><line class="wire" x1="666" y1="275" x2="706" y2="275"/><text x="668" y="260" class="accent" text-anchor="start">0.5 V</text><line class="wire" x1="706" y1="275" x2="762" y2="275"/><line class="wire" x1="762" y1="275" x2="780" y2="275"/><rect x="780" y="263" width="64" h