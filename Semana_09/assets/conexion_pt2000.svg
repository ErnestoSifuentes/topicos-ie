<text class="small" x="45" y="529">Condición de equilibrio: R1/R2 = R3/R(Tmin). Ejemplo: R1 = R3 = 15 kΩ; R2 ≈ R(Tmin).</text>
<text class="small" x="45" y="553">Ambas ramas mantienen corriente cercana a 190 µA (no usar R1 = R2 = R3 = Rmin a 3.3 V).</text>
<text class="small" x="45" y="580">Verificar con la ficha técnica del AI: rango de modo común, salida, alimentación y cálculo de RG.</text>
