<svg baseProfile="full" height="330" version="1.1" viewBox="0 0 1050 330" width="1050" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="tip" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M 0,0 L 10,5 L 0,10 Z" fill="#17334a" /></marker></defs><rect fill="#ffffff" height="330" width="1050" x="0" y="0" /><text fill="#17334a" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle" x="520" y="34">CONTROLADOR PID · acciones separadas y derivada sobre la medida</text><rect fill="#eef6f6" height="72" rx="11" ry="11" stroke="#116f72" stroke-width="2" width="150" x="32" y="125" /><text fill="#17334a" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle" x="107.0" y="157">Error e</text><text fill="#607785" font-family="Arial" font-size="14" text-anchor="middle" x="107.0" y="184">r − y</text><line stroke="#17334a" stroke-width="2" x1="182" x2="252" y1="161" y2="161" /><rect fill="#eef6f6" height="65" rx="11" ry="11" stroke="#116f72" stroke-width="2" width="284" x="260" y="68" /><text fill="#17334a" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle" x="402.0" y="100">P = Kc·e</text><text fill="#607785" font-family="Arial" font-size="14" text-anchor="middle" x="402.0" y="127">Proporcional</text><rect fill="#eef6f6" height="65" rx="11" ry="11" stroke="#116f72" stroke-width="2" width="284" x="260" y="147" /><text fill="#17334a" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle" x="402.0" y="179">I = ∫e</text><text fill="#607785" font-family="Arial" font-size="14" text-anchor="middle" x="402.0" y="206">Integral</text><rect fill="#eef6f6" height="65" rx="11" ry="11" stroke="#116f72" stroke-width="2" width="284" x="260" y="227" /><text fill="#17334a" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle" x="402.0" y="259">D = −KcTd·dy/dt</text><text fill="#607785" font-family="Arial" font-size="14" text-anchor="middle" x="402.0" y="286">Derivada medida</text><line stroke="#17334a" stroke-width="2" x1="250" x2="250" y1="161" y2="100" /><line marker-end="url(tip)" stroke="#17334a" stroke-width="2" x1="250" x2="260" y1="100" y2="100" /><line marker-end="url(tip)" stroke="#17334a" stroke-width="2" x1="250" x2="260" y1="161" y2="180" /><text fill="#116f72" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" x="66" y="278">Medida y(t)</text><line marker-end="url(tip)" stroke="#17334a" stroke-width="2" x1="148" x2="260" y1="257" y2="257" /><text fill="#a57437" font-family="Arial" font-size="13" font-weight="normal" text-anchor="start" x="320" y="320">La acción D deriva la medida; evita una patada ante saltos de SP</text><line stroke="#17334a" stroke-width="2" x1="544" x2="680" y1="100" y2="100" /><line stroke="#17334a" stroke-width="2" x1="544" x2="680" y1="180" y2="180" /><line stroke="#17334a" stroke-width="2" x1="544" x2="680" y1="257" y2="257" /><line stroke="#17334a" stroke-width="2" x1="680" x2="680" y1="100" y2="257" /><circle cx="710" cy="180" fill="#fff" r="22" stroke="#17334a" stroke-width="2" /><line marker-end="url(tip)" stroke="#17334a" stroke-width="2" x1="680" x2="688" y1="180" y2="180" /><line marker-end="url(tip)" stroke="#17334a" stroke-width="2" x1="732" x2="806" y1="180" y2="180" /><rect fill="#eef6f6" height="75" rx="11" ry="11" stroke="#116f72" stroke-width="2" width="206" x="806" y="143" /><text fill="#17334a" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle" x="909.0" y="175">Sat[0,100]</text><text fill="#607785" font-family="Arial" font-size="14" text-anchor="middle" x="909.0" y="202">Salida Q1 (%)</text></svg>